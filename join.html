<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Join Session | SyncSound</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="joinContainer">

        <div class="joinCard">

            <h1>🎧 Join Session</h1>

            <p>

                Enter the Session ID and Password shared by your friend.

            </p>

            <div class="joinForm">

                <label for="sessionInput">

                    Session ID

                </label>

                <input
                    type="text"
                    id="sessionInput"
                    placeholder="Example : SYNC2001">

                <label for="sessionPassword">

                    Password

                </label>

                <input
                    type="password"
                    id="sessionPassword"
                    placeholder="Enter Session Password">

                <button id="joinSessionBtn">

                    🚀 Request to Join

                </button>

            </div>

            <p id="joinStatus"></p>

        </div>

    </div>

    <script type="module"
            src="home.js">
    </script>

</body>

</html>
