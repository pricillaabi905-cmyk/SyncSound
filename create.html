<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Session | SyncSound</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="createContainer">

        <div class="createCard">

            <h1>🎬 Create Session</h1>

            <p>

                Create a new listening session and invite your friend.

            </p>

            <div class="createForm">

                <label>

                    Session Name

                </label>

                <input
                    id="sessionName"
                    type="text"
                    placeholder="Movie Night">

                <label>

                    Maximum Users

                </label>

                <select id="maxUsers">

                    <option>2</option>

                    <option>3</option>

                    <option>4</option>

                </select>

                <label>

                    Password (Optional)

                </label>

                <input
                    id="sessionPassword"
                    type="password"
                    placeholder="Optional Password">

                <button id="createSessionBtn">

                    🚀 Create Session

                </button>

            </div>

        </div>

    </div>

    <script type="module"
            src="home.js">
    </script>

</body>

</html>
